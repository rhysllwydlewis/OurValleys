packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@16.3.8"
  - "@next/eslint-plugin-next@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - eslint-config-next@16.3.8
  - next@16.3.8

overrides:
  # sharp <0.35.4 is affected by GHSA-g89c-p67h-r497 and GHSA-2jg2-4ch7-h545
  # (libheif vulnerabilities); <0.35.5 is affected by GHSA-wq5f-xc86-pv6w
  # (librsvg vulnerability).
  sharp: ">=0.35.5"
  # Next.js currently pins a vulnerable PostCSS 8.4.x transitive dependency.
  postcss: "8.5.19"
  # ESLint's transitive dependency tree includes brace-expansion releases affected by
  # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895 (the latter bypasses the CVE-2026-14257
  # mitigation present in 5.0.8), GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7
  # (fixed in 5.0.11).
  brace-expansion: "5.0.11"
  # ESLint's transitive dependency tree pulls js-yaml 4.3.0, affected by
  # GHSA-5p4m-2wfm-xmqj (quadratic CPU consumption in !!omap resolution).
  js-yaml: "4.3.2"
  # PostCSS's transitive dependency tree pulls nanoid 3.3.16, affected by
  # GHSA-2v37-7h3g-55p8 (custom generators can loop indefinitely when size is zero).
  nanoid: "3.3.18"
  # next/styled-jsx and eslint-plugin-react-hooks both pull browserslist <=4.28.6,
  # affected by GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g.
  browserslist: "4.28.8"
  # PostCSS's transitive dependency source-map-js <1.2.2 is affected by
  # GHSA-68fv-2mgg-jv7q (event-loop denial of service).
  source-map-js: "1.2.2"

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested patterns. No patched release
    # exists on npm yet (latest is 3.0.3). The only path is the lint toolchain
    # (eslint-config-next > fast-glob > micromatch), which globs repository-controlled
    # patterns and never ships to production. Remove once braces >=3.0.4 is published.
    - GHSA-vfj7-8cjw-p6xm
