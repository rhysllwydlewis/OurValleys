name: Formatter diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatter-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Enable the repository package manager
        run: corepack enable
      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate authoritative formatter patch
        run: |
          pnpm format
          git diff --binary > formatter.patch
          test -s formatter.patch
      - name: Upload formatter patch
        uses: actions/upload-artifact@v4
        with:
          name: formatter-patch
          path: formatter.patch
          if-no-files-found: error
