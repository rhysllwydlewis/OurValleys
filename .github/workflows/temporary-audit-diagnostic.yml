name: Temporary dependency lockfile diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Generate patched lockfile and audit evidence
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile-diagnostic
          path: |
            pnpm-lock.yaml
            dependency-audit.json
          retention-days: 1
