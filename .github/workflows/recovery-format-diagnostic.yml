name: Recovery formatter diagnostic

on:
  push:
    branches:
      - agent/launch-foundation-mega-slice

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable the repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate repository-pinned formatted file
        run: pnpm exec prettier --write docs/30-railway-postgres-and-demo-access.md
      - name: Upload exact formatted file
        uses: actions/upload-artifact@v4
        with:
          name: recovery-formatted-railway-doc
          path: docs/30-railway-postgres-and-demo-access.md
          if-no-files-found: error
          retention-days: 1
