name: Temporary pre-merge formatter

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            .github/workflows/production-smoke.yml \
            .github/workflows/standard-postgres.yml \
            docs/30-railway-postgres-and-demo-access.md \
            docs/33-development-demo-and-external-news.md \
            docs/34-launch-foundation-and-public-release-controls.md \
            README.md \
            scripts/import-reference-data.ts \
            scripts/provision-demo-account.ts \
            src/app/sitemap.test.ts \
            src/lib/env.ts \
            src/lib/release-stage.test.ts \
            src/modules/businesses/public.ts \
            tests/e2e/production-smoke.spec.ts \
            tests/integration/business-discovery.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-premerge-review
          path: |
            .github/workflows/production-smoke.yml
            .github/workflows/standard-postgres.yml
            docs/30-railway-postgres-and-demo-access.md
            docs/33-development-demo-and-external-news.md
            docs/34-launch-foundation-and-public-release-controls.md
            README.md
            scripts/import-reference-data.ts
            scripts/provision-demo-account.ts
            src/app/sitemap.test.ts
            src/lib/env.ts
            src/lib/release-stage.test.ts
            src/modules/businesses/public.ts
            tests/e2e/production-smoke.spec.ts
            tests/integration/business-discovery.test.ts
          retention-days: 1