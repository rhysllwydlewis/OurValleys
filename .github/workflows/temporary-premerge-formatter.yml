name: Temporary pre-merge formatter

on:
  push:
    branches:
      - agent/launch-foundation-mega-slice

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-foundation-mega-slice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            .github/workflows/production-smoke.yml \
            .github/workflows/standard-postgres.yml \
            docs/30-railway-postgres-and-demo-access.md \
            docs/33-development-demo-and-external-news.md \
            docs/34-launch-foundation-and-public-release-controls.md \
            README.md \
            scripts/import-reference-data.ts \
            scripts/provision-demo-account.ts \
            src/app/sitemap.test.ts \
            src/lib/env.ts \
            src/lib/release-stage.test.ts \
            src/modules/businesses/public.ts \
            tests/e2e/production-smoke.spec.ts \
            tests/integration/business-discovery.test.ts
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format pre-merge review changes"
          git push origin HEAD:agent/launch-foundation-mega-slice