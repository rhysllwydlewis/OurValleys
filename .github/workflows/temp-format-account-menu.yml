name: Temporary account menu formatter

on:
  push:
    branches:
      - agent/fix-home-account-menu-layering
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: pnpm exec prettier --write src/components/auth/account-menu.tsx tests/e2e/development-demo-access.spec.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-account-menu-files
          path: |
            src/components/auth/account-menu.tsx
            tests/e2e/development-demo-access.spec.ts
          retention-days: 1
