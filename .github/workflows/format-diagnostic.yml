name: Temporary formatter diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Format remaining policy route
        run: pnpm exec prettier --write 'src/app/policies/[policy]/page.tsx'
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-policy-route
          path: src/app/policies
          retention-days: 1
