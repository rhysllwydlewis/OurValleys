name: Temporary formatter diagnostic

on:
  push:
    branches:
      - agent/launch-foundation-mega-slice

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Format changed source
        run: |
          pnpm exec prettier --write \
            scripts/configure-demo-access.ts \
            scripts/import-reference-data.ts \
            src/app/businesses/page.tsx \
            src/app/login/page.tsx \
            'src/app/policies/[policy]/page.tsx' \
            src/app/policies/page.tsx \
            src/data/reference/business-categories.ts \
            src/data/reference/validate-reference-data.ts \
            src/lib/public-sitemap.ts \
            src/lib/release-stage.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-launch-foundation
          path: |
            scripts/configure-demo-access.ts
            scripts/import-reference-data.ts
            src/app/businesses/page.tsx
            src/app/login/page.tsx
            src/app/policies/[policy]/page.tsx
            src/app/policies/page.tsx
            src/data/reference/business-categories.ts
            src/data/reference/validate-reference-data.ts
            src/lib/public-sitemap.ts
            src/lib/release-stage.ts
          retention-days: 1
