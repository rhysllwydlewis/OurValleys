name: Production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed HTTPS origin; falls back to PRODUCTION_BASE_URL or a successful production deployment from main"
        required: false
        type: string
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.deployment_status.environment || 'manual' }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'OurValleys / production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Not the deployment's environment_url: Railway sets that to a link to its own
      # project dashboard, not to the site.
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_BASE_URL || 'https://ourvalleys.co.uk' }}
      PRODUCTION_SMOKE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Require a configured deployed origin
        shell: bash
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "Supply base_url manually or set PRODUCTION_BASE_URL." >&2
            exit 1
          fi
          case "$PLAYWRIGHT_BASE_URL" in
            https://*) ;;
            *) echo "Production smoke requires an HTTPS application origin." >&2; exit 1 ;;
          esac

      - name: Enable the repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise deployed health discovery and viewer boundaries
        run: pnpm exec playwright test tests/e2e/production-smoke.spec.ts

      - name: Export production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
