name: Recovery format admin place tests

on:
  push:
    branches:
      - agent/test-admin-place-schemas
    paths:
      - .github/workflows/recovery-format-admin-places.yml

permissions:
  contents: write

jobs:
  format-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-admin-place-schemas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable the repository package manager
        run: corepack enable
      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository-pinned formatter
        run: pnpm exec prettier --write src/modules/reference-data/admin-places.test.ts
      - name: Remove temporary recovery workflow
        run: rm .github/workflows/recovery-format-admin-places.yml
      - name: Commit authoritative formatter output
        run: |
          git config user.name "OurValleys PR Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/reference-data/admin-places.test.ts .github/workflows/recovery-format-admin-places.yml
          git diff --cached --check
          git commit -m "Apply repository formatter to admin place schema tests"
          git push origin HEAD:agent/test-admin-place-schemas
