name: Temporary homepage formatter

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/modules/home/public.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-home-public
          path: src/modules/home/public.ts
          retention-days: 1
